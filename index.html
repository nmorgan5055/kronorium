<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kronorium · BO3 Easter Egg Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: Group 935 field dossier — lab-paper sheets, stencil crate lettering, 115-blue ink, red completion stamps */
:root {
  --paper: #E4E9E5;
  --sheet: #F5F7F4;
  --ink: #17201D;
  --muted: #56645F;
  --rule: #C6CFCA;
  --accent: #1D5EA6;
  --accent-ink: #FFFFFF;
  --accent-soft: #D8E4F1;
  --stamp: #B2382C;
  --ok: #2C7A4C;
  --shadow: 0 1px 0 rgba(23,32,29,.06), 0 6px 18px -10px rgba(23,32,29,.35);
  --f-display: 'Big Shoulders Stencil Display', 'Oswald', Impact, 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1312; --sheet: #161D1B; --ink: #DCE4E0; --muted: #8D9A95; --rule: #29332F;
    --accent: #6EAEF2; --accent-ink: #0B1420; --accent-soft: #19293B; --stamp: #E26A5D; --ok: #5BC08A;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1312; --sheet: #161D1B; --ink: #DCE4E0; --muted: #8D9A95; --rule: #29332F;
  --accent: #6EAEF2; --accent-ink: #0B1420; --accent-soft: #19293B; --stamp: #E26A5D; --ok: #5BC08A;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { margin: 0 auto; padding-inline: clamp(16px, 3.5vw, 64px); }
.mono { font-family: var(--f-mono); }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .04em; text-decoration: none; color: var(--ink); line-height: 1; }
.brand small { font-family: var(--f-mono); font-weight: 400; font-size: 11px; letter-spacing: .1em; color: var(--muted); margin-left: 8px; text-transform: uppercase; }
.spacer { flex: 1; }
.iconbtn {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px;
  min-height: 36px; padding: 0 12px; cursor: pointer; font-size: 13px; font-family: var(--f-mono);
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink);
}
.iconbtn:hover { border-color: var(--accent); }
.back { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
.iconbtn { white-space: nowrap; }
@media (max-width: 520px) { .brand small { display: none; } .brand { font-size: 22px; } }

/* ---------- home ---------- */
.hero { padding-block: 28px 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 9vw, 84px); line-height: .9; letter-spacing: .02em; }
.hero p { margin: 10px 0 0; color: var(--muted); max-width: 52ch; }
.summary {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow);
  padding: 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; min-width: 0;
}
.pie { width: 148px; height: 148px; display: block; }
.pie text { font-family: var(--f-display); }
.stats { display: grid; gap: 10px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 28px; font-weight: 800; line-height: 1; display: block; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; padding-top: 20px; }
  .summary { grid-template-columns: auto minmax(0,1fr); }
  .pie { width: 120px; height: 120px; }
}

.group { padding-block: 22px 6px; }
.group-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.group-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: .03em; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

.card {
  position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px;
  padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); }
.card .name { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: .95; letter-spacing: .02em; text-decoration: none; color: var(--ink); }
.card .name::after { content: ''; position: absolute; inset: 0; border-radius: 12px; }
.card .main { font-size: 14px; color: var(--muted); }
.card .main strong { color: var(--ink); font-weight: 500; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 8px; align-items: center; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.track { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 3px; }
.fill.side { background: var(--muted); }
.bar span:last-child { font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.card-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; }
.card-foot .iconbtn { position: relative; z-index: 2; }
.runinfo { font-family: var(--f-mono); font-size: 12px; color: var(--ink); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; min-height: 22px; }
.stamp {
  flex: none; pointer-events: none;
  font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .1em;
  color: var(--stamp); border: 2px solid var(--stamp); border-radius: 4px; padding: 1px 7px;
  transform: rotate(-7deg); opacity: .92; text-transform: uppercase;
}
.card.done { border-color: color-mix(in srgb, var(--stamp) 45%, var(--rule)); }

.tools { padding-block: 28px 40px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }

/* ---------- map page ---------- */
.mhead { padding-block: 22px 12px; display: grid; gap: 8px; }
.mhead h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(40px, 8vw, 72px); line-height: .9; letter-spacing: .02em; }
.mhead .quest { font-size: 16px; }
.mhead .quest b { font-weight: 600; }
.mhead p { margin: 0; color: var(--muted); max-width: 62ch; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
.setting { display: grid; gap: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 6px 14px; min-height: 36px;
  cursor: pointer; font-size: 14px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.toggles { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; min-height: 32px; }
.toggles input { width: 18px; height: 18px; accent-color: var(--accent); }

.tabs {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 53px); z-index: 15;
  background: var(--paper); margin-top: 14px; border-bottom: 1px solid var(--rule);
}
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 0; background: none; cursor: pointer; padding: 12px 12px 10px; min-height: 46px;
  font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  border-bottom: 3px solid transparent;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .cnt { font-family: var(--f-mono); font-size: 11px; font-weight: 400; letter-spacing: 0; margin-left: 6px; color: var(--muted); }
.tab .mainmark { color: var(--stamp); margin-right: 4px; }

.sections { display: grid; gap: 18px; padding-block: 18px 40px; }
.section { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; min-width: 0; }
.sec-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 14px 16px 10px; border-bottom: 1px dashed var(--rule); }
.sec-head h3 { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: .02em; line-height: 1.05; }
.sec-head .cnt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-head .ext { margin-left: auto; display: flex; gap: 12px; font-family: var(--f-mono); font-size: 12px; }
.sec-head .ext a { text-decoration: none; }
.section.complete .sec-head h3::after { content: 'DONE'; font-size: 13px; color: var(--stamp); border: 1.5px solid var(--stamp); border-radius: 3px; padding: 0 5px; margin-left: 10px; vertical-align: 4px; letter-spacing: .1em; }
.note { margin: 12px 16px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); font-size: 14px; border-radius: 0 6px 6px 0; }
.steps { list-style: none; margin: 0; padding: 6px 0; }
.step { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 4px 10px; padding: 10px 16px 10px 10px; }
.step + .step { border-top: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
.step .chk { width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; }
.step .chk input { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; border: 2px solid var(--muted); border-radius: 6px; margin: 0; cursor: pointer; display: grid; place-items: center; background: var(--sheet); }
.step .chk input::after { content: ''; width: 12px; height: 7px; border-left: 3px solid var(--accent-ink); border-bottom: 3px solid var(--accent-ink); transform: rotate(-45deg) translate(1px,-1px); opacity: 0; }
.step .chk input:checked { background: var(--accent); border-color: var(--accent); }
.step .chk input:checked::after { opacity: 1; }
.step .body { min-width: 0; padding-top: 10px; }
.step .txt { margin: 0; max-width: 70ch; }
.step .num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); margin-right: 2px; }
.step.checked .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.step .tag { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.thumbs { display: flex; gap: 10px; overflow-x: auto; padding: 10px 2px 4px; scroll-snap-type: x proximity; }
.thumb { flex: none; width: min(300px, 78vw); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--paper); cursor: zoom-in; padding: 0; text-align: left; scroll-snap-align: start; }
.thumb img { display: block; width: 100%; aspect-ratio: 16 / 10; height: auto; object-fit: cover; background: var(--rule); }
.thumb span { display: block; font-size: 13px; line-height: 1.25; padding: 5px 6px 6px; color: var(--muted); }
.thumb.broken img { display: none; }
@media (min-width: 700px) { .thumb { width: 600px; } .thumb span { font-size: 14px; padding: 7px 10px 9px; } }
@media (min-width: 1200px) {
  .step .body { display: grid; grid-template-columns: minmax(280px, 34rem) minmax(0, 1fr); gap: 8px 28px; align-items: start; }
  .step .thumbs { padding-top: 6px; }
}
.rec.inline { margin: 10px 0 2px; }
.rec.inline .rec-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.rec { margin: 12px 16px 4px; padding: 12px 14px 14px; border: 1.5px dashed color-mix(in srgb, var(--accent) 60%, var(--rule)); border-radius: 10px; background: color-mix(in srgb, var(--accent-soft) 55%, var(--sheet)); display: grid; gap: 10px; }
.rec-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.rec-head b { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; }
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 16px; }
.rf { display: grid; gap: 5px; min-width: 0; }
.rf.wide { grid-column: 1 / -1; }
.rf select, .rf input { min-height: 40px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); padding: 6px 8px; width: 100%; min-width: 0; }
.seqrow { display: flex; gap: 6px; align-items: center; }
.seqrow select, .seqrow input { flex: 1; max-width: 220px; }
.seqrow .arrow { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.rec .chip { background: var(--sheet); }
.thumb.broken::before { content: 'Picture unavailable'; display: grid; place-items: center; aspect-ratio: 16 / 10; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); text-align: center; padding: 6px; }
.empty { padding: 24px 16px; color: var(--muted); text-align: center; }
.danger { color: var(--stamp); }
.reset-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding-bottom: 40px; }

/* ---------- dialogs ---------- */
dialog {
  border: 1px solid var(--rule); border-radius: 14px; background: var(--sheet); color: var(--ink);
  width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); padding: 0; box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10,14,13,.55); }
.dlg { padding: 18px; display: grid; gap: 14px; }
.dlg h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: .02em; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.form .full { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; }
.field input, .field select, .field textarea {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 9px 10px; min-height: 42px; width: 100%;
}
.field textarea { min-height: 84px; resize: vertical; font-size: 14px; }
.timebox { display: flex; gap: 6px; align-items: center; }
.timebox input { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 0 16px; min-height: 42px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.red { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.runs { display: grid; gap: 8px; }
.run { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.run .meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.msg { font-size: 13px; color: var(--ok); min-height: 1.2em; }

/* ---------- lightbox ---------- */
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(6,9,8,.92); display: grid; grid-template-rows: auto minmax(0,1fr) auto; padding: calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 12px); color: #E8EEEB; }
.lightbox .lb-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 12px; }
.lightbox img { max-width: 100%; max-height: 100%; margin: auto; display: block; object-fit: contain; border-radius: 6px; }
.lightbox .lb-stage { display: grid; min-height: 0; }
.lightbox .lb-bottom { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding-top: 10px; }
.lightbox .cap { font-size: 15px; text-align: center; flex: 1; }
.lightbox button { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; min-width: 48px; min-height: 44px; cursor: pointer; font-size: 18px; }
.lightbox a { color: #9CC8F5; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="back iconbtn" id="backBtn" href="#" hidden>← Maps</a>
    <a class="brand" href="#" id="brand">KRONORIUM<small>BO3 Zombies</small></a>
    <span class="spacer"></span>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Change theme">◐ Auto</button>
  </div>
</header>

<main id="app"></main>

<dialog id="runDlg">
  <form class="dlg" id="runForm" method="dialog">
    <div>
      <div class="label" id="runMapLabel">Log completion</div>
      <h2 id="runTitle">Map</h2>
    </div>
    <div class="runs" id="runList"></div>
    <div class="form">
      <div class="field">
        <label class="label" for="runDate">Date</label>
        <input type="date" id="runDate">
      </div>
      <div class="field">
        <label class="label" for="runPlayers">Players</label>
        <select id="runPlayers"><option value="1">Solo</option><option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option></select>
      </div>
      <div class="field">
        <span class="label">Time taken</span>
        <div class="timebox"><input id="runH" type="number" min="0" max="99" inputmode="numeric" placeholder="h" aria-label="Hours"><span>h</span><input id="runM" type="number" min="0" max="59" inputmode="numeric" placeholder="min" aria-label="Minutes"><span>m</span></div>
      </div>
      <div class="field">
        <label class="label" for="runRound">Round finished</label>
        <input id="runRound" type="number" min="1" inputmode="numeric" placeholder="e.g. 24">
      </div>
      <div class="field full">
        <label class="label" for="runNotes">Notes (bow, strategy, who played…)</label>
        <textarea id="runNotes" placeholder="Fire bow, got a lucky Thundergun on round 8"></textarea>
      </div>
    </div>
    <div class="btns">
      <button type="button" class="btn ghost" id="runCancel">Close</button>
      <button type="submit" class="btn" id="runSave">Save completion</button>
    </div>
  </form>
</dialog>

<dialog id="backupDlg">
  <div class="dlg">
    <div>
      <div class="label">Progress is saved on this device only</div>
      <h2>Backup &amp; restore</h2>
    </div>
    <div class="field">
      <label class="label" for="exportBox">Your progress (copy this to move it to another device)</label>
      <textarea id="exportBox" readonly></textarea>
    </div>
    <div class="btns" style="justify-content:flex-start">
      <button type="button" class="btn" id="copyBtn">Copy</button>
      <button type="button" class="btn ghost" id="dlBtn">Download file</button>
    </div>
    <div class="field">
      <label class="label" for="importBox">Restore: paste a backup here, or pick a backup file</label>
      <textarea id="importBox" placeholder='{"checks":{...}}'></textarea>
      <input type="file" id="importFile" accept=".json,application/json,text/plain">
    </div>
    <div class="msg" id="backupMsg" role="status"></div>
    <div class="btns">
      <button type="button" class="btn ghost" id="backupClose">Close</button>
      <button type="button" class="btn red" id="importBtn">Replace my progress</button>
    </div>
  </div>
</dialog>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Picture viewer">
  <div class="lb-top"><span id="lbCount"></span><a id="lbOpen" href="#" target="_blank" rel="noopener">Open full size ↗</a><button type="button" id="lbClose" aria-label="Close">✕</button></div>
  <div class="lb-stage"><img id="lbImg" alt="" referrerpolicy="no-referrer"></div>

<script>
(function () {
  'use strict';
  const KEY = 'kronorium.bo3.v1';
  const GROUPS = [
    ['base', 'Launch maps', 'Shadows of Evil and the bonus map'],
    ['dlc', 'Season Pass', 'Awakening · Eclipse · Descent · Salvation'],
    ['chron', 'Zombies Chronicles', 'Eight remastered classics']
  ];

  // ---------- storage ----------
  let S = { checks: {}, settings: {}, runs: {}, notes: {}, prefs: { pics: true, hideDone: false, theme: 'auto' } };
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw);
        S = Object.assign(S, d);
        S.prefs = Object.assign({ pics: true, hideDone: false, theme: 'auto' }, d.prefs || {});
      }
    } catch (e) { /* storage unavailable */ }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  load();

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const byId = Object.fromEntries(MAPS.map(m => [m.id, m]));
  function stepKey(m, t, si, i) { return m.id + '.' + t.id + '.' + si + '.' + i; }
  function mapSettings(m) { return S.settings[m.id] || (S.settings[m.id] = {}); }
  function visible(m, w) {
    if (!w) return true;
    const ms = mapSettings(m);
    return Object.keys(w).every(k => {
      const sel = ms[k];
      if (!sel || !sel.length) return true;
      return w[k].some(v => sel.includes(v));
    });
  }
  function norm(step) {
    if (Array.isArray(step)) return { t: step[0], i: step[1] || [], w: step[2] || null };
    return step;
  }
  function imgUrl(m, p) { return /^https?:/.test(p) ? p : (m.img || '') + p; }
  function countTab(m, t) {
    let done = 0, total = 0;
    t.sections.forEach((sec, si) => {
      if (!visible(m, sec.w)) return;
      sec.steps.forEach((st, i) => {
        const s = norm(st);
        if (!visible(m, s.w)) return;
        total++;
        if (S.checks[stepKey(m, t, si, i)]) done++;
      });
    });
    return { done, total };
  }
  function countMap(m) {
    const main = { done: 0, total: 0 }, side = { done: 0, total: 0 };
    m.tabs.forEach(t => {
      const c = countTab(m, t);
      const tgt = t.main ? main : side;
      tgt.done += c.done; tgt.total += c.total;
    });
    return { main, side };
  }
  const runsOf = m => S.runs[m.id] || [];
  const isDone = m => runsOf(m).length > 0;
  function fmtTime(mins) {
    if (mins == null || isNaN(mins)) return '';
    const h = Math.floor(mins / 60), mm = mins % 60;
    return h ? h + 'h ' + String(mm).padStart(2, '0') + 'm' : mm + 'm';
  }
  const plLabel = p => p == 1 ? 'Solo' : p + ' players';
  function bestRun(m) {
    const r = runsOf(m).filter(x => x.mins != null);
    if (!r.length) return runsOf(m)[0];
    return r.reduce((a, b) => (b.mins < a.mins ? b : a));
  }
  function pct(c) { return c.total ? Math.round(100 * c.done / c.total) : 0; }

  // ---------- theme ----------
  function applyTheme() {
    const t = S.prefs.theme;
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    $('#themeBtn').textContent = ({ auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark' })[t];
  }
  $('#themeBtn').addEventListener('click', () => {
    const order = ['auto', 'light', 'dark'];
    S.prefs.theme = order[(order.indexOf(S.prefs.theme) + 1) % 3];
    save(); applyTheme();
  });
  applyTheme();

  // ---------- pie ----------
  function pieSVG(done, total) {
    const r = 54, c = 2 * Math.PI * r, frac = total ? done / total : 0;
    const p = Math.round(frac * 100);
    return '<svg class="pie" viewBox="0 0 148 148" role="img" aria-label="' + done + ' of ' + total + ' main quests complete">' +
      '<circle cx="74" cy="74" r="' + r + '" fill="none" stroke="var(--rule)" stroke-width="22"/>' +
      (frac > 0 ? '<circle cx="74" cy="74" r="' + r + '" fill="none" stroke="var(--stamp)" stroke-width="22" stroke-dasharray="' + (c * frac).toFixed(2) + ' ' + c.toFixed(2) + '" transform="rotate(-90 74 74)"' + (frac >= 1 ? '' : '') + '/>' : '') +
      '<text x="74" y="80" text-anchor="middle" font-size="34" font-weight="800" fill="var(--ink)">' + p + '%</text>' +
      '<text x="74" y="100" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="var(--muted)" letter-spacing="1">MAIN QUESTS</text>' +
      '</svg>';
  }

  // ---------- home ----------
  function renderHome() {
    $('#backBtn').hidden = true;
    document.title = 'Kronorium · BO3 Easter Egg Tracker';
    const mains = MAPS.filter(m => m.main);
    const doneMains = mains.filter(isDone).length;
    let sideDone = 0, sideTotal = 0, runsTotal = 0;
    MAPS.forEach(m => { const c = countMap(m); sideDone += c.side.done; sideTotal += c.side.total; runsTotal += runsOf(m).length; });

    let html = '<section class="wrap hero"><div><div class="label">Black Ops III · Zombies</div><h1>Easter Egg<br>Field Log</h1>' +
      '<p>Pick a map for step-by-step guides with checkboxes. Main quests count toward the chart; side eggs live on their own tabs. Everything saves on this device.</p></div>' +
      '<div class="summary">' + pieSVG(doneMains, mains.length) +
      '<div class="stats"><div class="stat"><b>' + doneMains + ' / ' + mains.length + '</b><span class="label">Main quests complete</span></div>' +
      '<div class="stat"><b>' + sideDone + ' / ' + sideTotal + '</b><span class="label">Side-egg steps checked</span></div>' +
      '<div class="legend"><span><i style="background:var(--stamp)"></i>Done</span><span><i style="background:var(--rule)"></i>Remaining</span><span>' + runsTotal + ' run' + (runsTotal === 1 ? '' : 's') + ' logged</span></div></div></div></section>';

    GROUPS.forEach(([g, title, sub]) => {
      const list = MAPS.filter(m => m.group === g);
      html += '<section class="wrap group"><div class="group-head"><h2>' + title + '</h2><span class="label">' + sub + '</span></div><div class="grid">';
      list.forEach(m => {
        const c = countMap(m), done = isDone(m), br = bestRun(m);
        html += '<article class="card' + (done ? ' done' : '') + '">' +
          '<div class="card-top"><span class="label">' + esc(m.pack) + '</span>' + (done ? '<span class="stamp">' + (m.main ? 'Complete' : 'Done') + '</span>' : '') + '</div>' +
          '<a class="name" href="#map/' + m.id + '">' + esc(m.name) + '</a>' +
          '<div class="main">' + (m.main ? 'Main quest: <strong>' + esc(m.main) + '</strong>' : 'No main quest · side eggs only') + '</div>' +
          '<div class="bars">' +
          (m.main ? '<div class="bar"><span>Main</span><div class="track"><div class="fill" style="width:' + pct(c.main) + '%"></div></div><span>' + c.main.done + '/' + c.main.total + '</span></div>' : '') +
          '<div class="bar"><span>Side</span><div class="track"><div class="fill side" style="width:' + pct(c.side) + '%"></div></div><span>' + c.side.done + '/' + c.side.total + '</span></div>' +
          '</div><div class="card-foot">' +
          (br ? '<span class="runinfo">' + [fmtTime(br.mins), plLabel(br.players), br.round ? 'R' + br.round : ''].filter(Boolean).join(' · ') + (runsOf(m).length > 1 ? ' · ' + runsOf(m).length + ' runs' : '') + '</span>' : '') +
          '<span class="spacer"></span><button type="button" class="iconbtn" data-log="' + m.id + '">' + (done ? 'Edit log' : (m.main ? 'Mark complete' : 'Mark done')) + '</button></div></article>';
      });
      html += '</div></section>';
    });

    html += '<section class="wrap tools"><button type="button" class="iconbtn" id="backupBtn">Backup &amp; restore</button>' +
      '<span>Progress lives in this browser. Use backup to move it between your phone and PC.</span></section>';
    $('#app').innerHTML = html;
    $('#app').querySelectorAll('[data-log]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); openRun(byId[b.dataset.log]); }));
    $('#backupBtn').addEventListener('click', openBackup);
  }

  // ---------- write-it-down fields ----------
  function notesOf(m) { S.notes = S.notes || {}; return S.notes[m.id] || (S.notes[m.id] = {}); }
  function recHTML(m, fields, inline) {
    if (!fields || !fields.length) return '';
    const N = notesOf(m);
    const opt = (o, v) => '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
    const f = fields.map(r => {
      const v = N[r.id];
      const lab = '<span class="label">' + esc(r.label) + '</span>';
      if (r.type === 'seq') {
        const arr = Array.isArray(v) ? v : [];
        let row = '';
        for (let i = 0; i < r.n; i++) row += (i ? '<span class="arrow">→</span>' : '') + '<select data-rec="' + r.id + '" data-i="' + i + '" aria-label="' + esc(r.label) + ' ' + (i + 1) + '"><option value="">' + (i + 1) + '…</option>' + r.opts.map(o => opt(o, arr[i])).join('') + '</select>';
        return '<div class="rf wide">' + lab + '<div class="seqrow">' + row + '</div></div>';
      }
      if (r.type === 'nums') {
        const arr = Array.isArray(v) ? v : [];
        let row = '';
        for (let i = 0; i < r.n; i++) row += (i ? '<span class="arrow">·</span>' : '') + '<input type="number" inputmode="numeric" data-rec="' + r.id + '" data-i="' + i + '" value="' + esc(arr[i] ?? '') + '" aria-label="' + esc(r.label) + ' ' + (i + 1) + '">';
        return '<div class="rf">' + lab + '<div class="seqrow">' + row + '</div></div>';
      }
      if (r.type === 'select') return '<div class="rf">' + lab + '<select data-rec="' + r.id + '"><option value="">Not found yet</option>' + r.opts.map(o => opt(o, v)).join('') + '</select></div>';
      if (r.type === 'multi') {
        const arr = Array.isArray(v) ? v : [];
        return '<div class="rf wide">' + lab + '<div class="chips">' + r.opts.map(o => '<button type="button" class="chip" data-recm="' + r.id + '" data-val="' + esc(o) + '" aria-pressed="' + arr.includes(o) + '">' + esc(o) + '</button>').join('') + '</div></div>';
      }
      return '<div class="rf">' + lab + '<input type="text" data-rec="' + r.id + '" value="' + esc(v || '') + '" placeholder="' + esc(r.ph || '') + '"></div>';
    }).join('');
    return '<div class="rec' + (inline ? ' inline' : '') + '"><div class="rec-head"><b>Write it down</b><span class="label">Saved for this game</span></div><div class="rec-grid">' + f + '</div></div>';
  }
  function wireRec(m) {
    const N = notesOf(m);
    $('#app').querySelectorAll('[data-rec]').forEach(el => {
      const ev = el.tagName === 'SELECT' ? 'change' : 'input';
      el.addEventListener(ev, () => {
        const id = el.dataset.rec;
        if (el.dataset.i != null) {
          const arr = Array.isArray(N[id]) ? N[id] : [];
          arr[+el.dataset.i] = el.value; N[id] = arr;
          // keep every copy of a shared field in sync
          $('#app').querySelectorAll('[data-rec="' + id + '"][data-i="' + el.dataset.i + '"]').forEach(o => { if (o !== el) o.value = el.value; });
        } else {
          N[id] = el.value;
          $('#app').querySelectorAll('[data-rec="' + id + '"]').forEach(o => { if (o !== el) o.value = el.value; });
        }
        save();
      });
    });
    $('#app').querySelectorAll('[data-recm]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.recm, v = b.dataset.val;
      let arr = Array.isArray(N[id]) ? N[id] : [];
      arr = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v);
      N[id] = arr; save();
      $('#app').querySelectorAll('[data-recm="' + id + '"]').forEach(o => o.setAttribute('aria-pressed', arr.includes(o.dataset.val)));
    }));
  }

  // ---------- map page ----------
  let curTab = {};
  function renderMap(m, tabId, keepScroll) {
    $('#backBtn').hidden = false;
    document.title = m.name + ' · Kronorium';
    const tab = m.tabs.find(t => t.id === tabId) || m.tabs.find(t => t.id === curTab[m.id]) || m.tabs[0];
    curTab[m.id] = tab.id;
    const ms = mapSettings(m);
    const y = window.scrollY;

    let h = '<section class="wrap mhead"><div class="label">' + esc(m.pack) + '</div><h1>' + esc(m.name) + '</h1>' +
      '<div class="quest">' + (m.main ? 'Main quest: <b>' + esc(m.main) + '</b>' + (isDone(m) ? ' <span class="tag" style="color:var(--stamp);border-color:var(--stamp)">Logged complete</span>' : '') : 'No main quest on this map') + '</div>' +
      '<p>' + esc(m.blurb) + '</p><div class="links">' +
      '<button type="button" class="iconbtn" id="logHere">' + (isDone(m) ? 'Edit completion log' : 'Mark complete') + '</button>' +
      (m.guide ? '<a class="iconbtn" href="' + esc(m.guide) + '" target="_blank" rel="noopener">Source guide ↗</a>' : '') +
      (m.wiki ? '<a class="iconbtn" href="' + esc(m.wiki) + '" target="_blank" rel="noopener">Wiki ↗</a>' : '') +
      '</div></section>';

    h += '<section class="wrap"><div class="panel">';
    (m.settings || []).forEach(st => {
      const sel = ms[st.id] || [];
      h += '<div class="setting"><span class="label">' + esc(st.label) + (st.multi ? ' · pick any' : '') + '</span><div class="chips">' +
        '<button type="button" class="chip" data-set="' + st.id + '" data-val="" aria-pressed="' + (!sel.length) + '">Show all</button>' +
        st.opts.map(o => '<button type="button" class="chip" data-set="' + st.id + '" data-val="' + o[0] + '" data-multi="' + (st.multi ? 1 : 0) + '" aria-pressed="' + sel.includes(o[0]) + '">' + esc(o[1]) + '</button>').join('') +
        '</div></div>';
    });
    h += '<div class="toggles"><label><input type="checkbox" id="hideDone"' + (S.prefs.hideDone ? ' checked' : '') + '> Hide checked steps</label>' +
      '<label><input type="checkbox" id="showPics"' + (S.prefs.pics ? ' checked' : '') + '> Show pictures</label></div></div></section>';

    h += '<nav class="tabs" aria-label="Guide sections"><div class="wrap" role="tablist">' + m.tabs.map(t => {
      const c = countTab(m, t);
      return '<button type="button" role="tab" class="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === tab.id) + '">' +
        (t.main ? '<span class="mainmark">★</span>' : '') + esc(t.label) + '<span class="cnt">' + c.done + '/' + c.total + '</span></button>';
    }).join('') + '</div></nav>';

    h += '<section class="wrap sections" id="secs">';
    let shown = 0;
    tab.sections.forEach((sec, si) => {
      if (!visible(m, sec.w)) return;
      const steps = sec.steps.map((st, i) => ({ s: norm(st), i, k: stepKey(m, tab, si, i) })).filter(x => visible(m, x.s.w));
      if (!steps.length) return;
      const doneN = steps.filter(x => S.checks[x.k]).length;
      const all = doneN === steps.length;
      const q = encodeURIComponent('Black Ops 3 ' + m.name + ' ' + sec.h.replace(/<[^>]+>/g, ''));
      let list = '';
      let num = 0;
      steps.forEach(x => {
        num++;
        const on = !!S.checks[x.k];
        if (on && S.prefs.hideDone) return;
        const tags = x.s.w ? Object.keys(x.s.w).map(k => {
          const set = (m.settings || []).find(z => z.id === k);
          if (!set) return '';
          return x.s.w[k].map(v => { const o = set.opts.find(z => z[0] === v); return o ? o[1] : v; }).join(' / ');
        }).filter(Boolean) : [];
        list += '<li class="step' + (on ? ' checked' : '') + '">' +
          '<label class="chk"><input type="checkbox" data-k="' + x.k + '"' + (on ? ' checked' : '') + ' aria-label="Step ' + num + ' done"></label>' +
          '<div class="body"><div class="left"><p class="txt"><span class="num">' + num + '.</span> ' + x.s.t + (tags.length ? tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') : '') + '</p>' +
          recHTML(m, (sec.rec || []).filter(r => r.at != null && [].concat(r.at).includes(x.i)), true) + '</div>' +
          (S.prefs.pics && x.s.i && x.s.i.length ? '<div class="thumbs">' + x.s.i.map((im, ii) => {
            const [p, cap] = im.split('|');
            return '<button type="button" class="thumb" data-gal="' + x.k + '" data-idx="' + ii + '"><img loading="lazy" referrerpolicy="no-referrer" alt="' + esc(cap || '') + '" src="' + esc(imgUrl(m, p)) + '"><span>' + esc(cap || '') + '</span></button>';
          }).join('') + '</div>' : '') +
          '</div></li>';
      });
      shown++;
      h += '<article class="section' + (all ? ' complete' : '') + '"><div class="sec-head"><h3>' + sec.h + '</h3><span class="cnt">' + doneN + '/' + steps.length + '</span>' +
        '<span class="ext"><a href="https://www.google.com/search?tbm=isch&q=' + q + '" target="_blank" rel="noopener">More pictures ↗</a><a href="https://www.youtube.com/results?search_query=' + q + '+guide" target="_blank" rel="noopener">Video ↗</a></span></div>' +
        (sec.note ? '<div class="note">' + sec.note + '</div>' : '') + recHTML(m, (sec.rec || []).filter(r => r.at == null), false) +
        (list ? '<ol class="steps">' + list + '</ol>' : '<div class="empty">All steps in this section are checked.</div>') + '</article>';
    });
    if (!shown) h += '<div class="empty">Nothing matches your filters. Tap “Show all” above.</div>';
    h += '</section>';
    h += '<section class="wrap reset-row" id="resetRow"><button type="button" class="iconbtn danger" id="resetBtn">Uncheck every step on ' + esc(m.name) + '</button>' + (m.tabs.some(t => t.sections.some(x => x.rec)) ? '<button type="button" class="iconbtn" id="clearNotes">Clear written notes (new game)</button>' : '') + '<span id="resetConfirm" hidden>Sure? This can’t be undone. <button type="button" class="iconbtn danger" id="resetYes">Yes, uncheck all</button> <button type="button" class="iconbtn" id="resetNo">Cancel</button></span></section>';

    $('#app').innerHTML = h;
    if (keepScroll) window.scrollTo(0, y);

    // wire events
    $('#logHere').addEventListener('click', () => openRun(m));
    $('#app').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.set, v = b.dataset.val, multi = b.dataset.multi === '1';
      let sel = ms[id] || [];
      if (!v) sel = [];
      else if (multi) sel = sel.includes(v) ? sel.filter(z => z !== v) : sel.concat(v);
      else sel = sel.includes(v) ? [] : [v];
      ms[id] = sel; save(); renderMap(m, tab.id, true);
    }));
    $('#hideDone').addEventListener('change', e => { S.prefs.hideDone = e.target.checked; save(); renderMap(m, tab.id, true); });
    $('#showPics').addEventListener('change', e => { S.prefs.pics = e.target.checked; save(); renderMap(m, tab.id, true); });
    $('#app').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      history.replaceState(null, '', '#map/' + m.id + '/' + b.dataset.tab);
      renderMap(m, b.dataset.tab, false);
      const tabsEl = $('.tabs');
      const top = tabsEl.getBoundingClientRect().top + window.scrollY - 60;
      if (window.scrollY > top) window.scrollTo(0, top);
    }));
    $('#app').querySelectorAll('input[data-k]').forEach(c => c.addEventListener('change', () => {
      if (c.checked) S.checks[c.dataset.k] = 1; else delete S.checks[c.dataset.k];
      save(); renderMap(m, tab.id, true);
    }));
    $('#app').querySelectorAll('.thumb img').forEach(img => img.addEventListener('error', () => img.parentElement.classList.add('broken'), { once: true }));
    $('#app').querySelectorAll('.thumb').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.gal;
      const st = findStep(m, k);
      if (st) openLightbox(m, st.i, +b.dataset.idx);
    }));
    wireRec(m);
    const cn = $('#clearNotes');
    if (cn) cn.addEventListener('click', () => { if (cn.dataset.armed) { delete S.notes[m.id]; save(); renderMap(m, tab.id, true); } else { cn.dataset.armed = 1; cn.textContent = 'Tap again to clear notes'; } });
    $('#resetBtn').addEventListener('click', () => { $('#resetConfirm').hidden = false; });
    $('#resetNo').addEventListener('click', () => { $('#resetConfirm').hidden = true; });
    $('#resetYes').addEventListener('click', () => {
      Object.keys(S.checks).forEach(k => { if (k.startsWith(m.id + '.')) delete S.checks[k]; });
      save(); renderMap(m, tab.id, false);
    });
  }
  function findStep(m, k) {
    const [, tid, si, i] = k.split('.');
    const t = m.tabs.find(x => x.id === tid);
    return t ? norm(t.sections[+si].steps[+i]) : null;
  }

  // ---------- lightbox ----------
  let LB = null;
  function openLightbox(m, imgs, idx) { LB = { m, imgs, idx }; showLB(); $('#lightbox').hidden = false; document.body.style.overflow = 'hidden'; }
  function showLB() {
    const [p, cap] = LB.imgs[LB.idx].split('|');
    const url = imgUrl(LB.m, p);
    $('#lbImg').src = url; $('#lbImg').alt = cap || '';
    $('#lbCap').textContent = cap || '';
    $('#lbOpen').href = url;
    $('#lbCount').textContent = (LB.idx + 1) + ' / ' + LB.imgs.length;
    $('#lbPrev').disabled = $('#lbNext').disabled = LB.imgs.length < 2;
  }
  function closeLB() { $('#lightbox').hidden = true; document.body.style.overflow = ''; LB = null; }
  const stepLB = d => { if (!LB) return; LB.idx = (LB.idx + d + LB.imgs.length) % LB.imgs.length; showLB(); };
  $('#lbClose').addEventListener('click', closeLB);
  $('#lbPrev').addEventListener('click', () => stepLB(-1));
  $('#lbNext').addEventListener('click', () => stepLB(1));
  $('#lightbox').addEventListener('click', e => { if (e.target.classList.contains('lb-stage')) closeLB(); });
  document.addEventListener('keydown', e => {
    if (!LB) return;
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowLeft') stepLB(-1);
    if (e.key === 'ArrowRight') stepLB(1);
  });
  let tx = null;
  $('#lightbox').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('#lightbox').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) stepLB(dx < 0 ? 1 : -1); tx = null; });

  // ---------- run log dialog ----------
  let runMap = null;
  function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function openRun(m) {
    runMap = m;
    $('#runTitle').textContent = m.name;
    $('#runMapLabel').textContent = m.main ? 'Main quest · ' + m.main : 'Map log';
    $('#runDate').value = today(); $('#runH').value = ''; $('#runM').value = ''; $('#runRound').value = ''; $('#runNotes').value = '';
    const pl = (mapSettings(m).pl || [])[0];
    $('#runPlayers').value = pl || '1';
    $('#runSave').textContent = isDone(m) ? 'Add another run' : 'Save completion';
    drawRuns();
    $('#runDlg').showModal();
  }
  function drawRuns() {
    const r = runsOf(runMap);
    $('#runList').innerHTML = r.length ? r.map((x, i) =>
      '<div class="run"><div><div>' + esc([fmtTime(x.mins) || 'Time not set', plLabel(x.players), x.round ? 'Round ' + x.round : ''].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="meta">' + esc(x.date || '') + (x.notes ? ' — ' + esc(x.notes) : '') + '</div></div>' +
      '<button type="button" class="iconbtn danger" data-del="' + i + '">Remove</button></div>').join('') : '';
    $('#runList').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      r.splice(+b.dataset.del, 1);
      if (!r.length) delete S.runs[runMap.id];
      save(); drawRuns(); $('#runSave').textContent = isDone(runMap) ? 'Add another run' : 'Save completion'; route(true);
    }));
  }
  $('#runCancel').addEventListener('click', () => $('#runDlg').close());
  $('#runForm').addEventListener('submit', e => {
    e.preventDefault();
    const h = parseInt($('#runH').value, 10), mi = parseInt($('#runM').value, 10);
    const mins = (isNaN(h) && isNaN(mi)) ? null : (isNaN(h) ? 0 : h) * 60 + (isNaN(mi) ? 0 : mi);
    const run = { date: $('#runDate').value, players: +$('#runPlayers').value, mins, round: parseInt($('#runRound').value, 10) || null, notes: $('#runNotes').value.trim() };
    (S.runs[runMap.id] = S.runs[runMap.id] || []).push(run);
    save(); $('#runDlg').close(); route(true);
  });

  // ---------- backup ----------
  function openBackup() {
    $('#exportBox').value = JSON.stringify(S);
    $('#importBox').value = ''; $('#backupMsg').textContent = '';
    $('#backupDlg').showModal();
  }
  $('#backupClose').addEventListener('click', () => $('#backupDlg').close());
  $('#copyBtn').addEventListener('click', () => {
    const t = $('#exportBox');
    const ok = () => { $('#backupMsg').textContent = 'Copied. Paste it into the restore box on your other device.'; };
    if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(ok, () => { t.select(); $('#backupMsg').textContent = 'Text selected — press copy on your keyboard.'; });
    else { t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} }
  });
  $('#dlBtn').addEventListener('click', () => {
    try {
      const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'kronorium-backup-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      $('#backupMsg').textContent = 'Backup file saved.';
    } catch (e) { $('#backupMsg').textContent = 'Download is blocked here. Use Copy instead.'; }
  });
  $('#importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $('#importBox').value = r.result; $('#backupMsg').textContent = 'File loaded. Press “Replace my progress” to restore it.'; }; r.readAsText(f);
  });
  $('#importBtn').addEventListener('click', () => {
    try {
      const d = JSON.parse($('#importBox').value);
      if (!d || typeof d !== 'object' || !d.checks) throw new Error('bad');
      S = { checks: d.checks || {}, settings: d.settings || {}, runs: d.runs || {}, notes: d.notes || {}, prefs: Object.assign({ pics: true, hideDone: false, theme: 'auto' }, d.prefs || {}) };
      save(); applyTheme(); $('#exportBox').value = JSON.stringify(S);
      $('#backupMsg').textContent = 'Progress restored.'; route(true);
    } catch (e) { $('#backupMsg').textContent = 'That doesn’t look like a Kronorium backup. Paste the whole text from the Copy box.'; }
  });

  // ---------- routing ----------
  let lastMap = '';
  function route(keep) {
    const parts = location.hash.replace(/^#/, '').split('/');
    if (parts[0] === 'map' && byId[parts[1]]) {
      const same = lastMap === parts[1];
      lastMap = parts[1];
      renderMap(byId[parts[1]], parts[2], keep && same);
      if (!same && !keep) window.scrollTo(0, 0);
    } else {
      const y = window.scrollY, wasMap = !!lastMap;
      lastMap = '';
      renderHome();
      window.scrollTo(0, wasMap ? (route.homeY || 0) : y);
    }
  }
  window.addEventListener('hashchange', () => route(false));
  document.addEventListener('click', e => { const a = e.target.closest('a[href^="#map/"]'); if (a) route.homeY = window.scrollY; }, true);
  $('#backBtn').addEventListener('click', e => { e.preventDefault(); location.hash = ''; });
  $('#brand').addEventListener('click', e => { e.preventDefault(); location.hash = ''; });
  route(false);
})();
</script>
</body>
</html>
